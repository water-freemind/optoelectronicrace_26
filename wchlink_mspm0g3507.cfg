# WCH-Link + MSPM0G3507 (地猛星)  OpenOCD 配置文件
# v3 — 高速版

source [find interface/cmsis-dap.cfg]

# SWD 时钟 — 8 MHz（CMSIS-DAP v2 通常支持）
adapter speed 8000

# USB 使用 bulk 模式提升传输速度
cmsis_dap_backend usb_bulk

transport select swd

# 设置实际 DPIDR (0x6ba02477)，而不是 cfg 默认的 0x2ba01477
set DAP_SWD_ID 0x6ba02477

set WORKAREABASE 0x20007000
set WORKAREASIZE 0x1000

source [find target/ti_mspm0.cfg]

# 强制使用硬件断点（Cortex-M0+ 软件断点慢）
gdb_breakpoint_override hard

# 覆盖 examine-start 事件
mspm0x.cpu configure -event examine-start { }

init
reset halt

# 修正栈指针到有效 SRAM 地址
reg sp 0x20007FFC
